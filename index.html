<!DOCTYPE html>
<html lang="en" data-theme="egg">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Scrambler</title>
    <meta
      name="description"
      content="Team Scrambler is a free tool to distribute people into balanced teams. Upload a CSV, configure team size and balancing criteria, and get fair teams in seconds."
    />
    <link rel="canonical" href="https://team-scrambler-v2.paularoid.deno.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://team-scrambler-v2.paularoid.deno.net/" />
    <meta property="og:title" content="Team Scrambler — Balanced Team Generator" />
    <meta
      property="og:description"
      content="Upload a CSV, configure your criteria, and instantly generate balanced teams. Free, private, runs in the browser."
    />
    <meta property="og:image" content="https://team-scrambler-v2.paularoid.deno.net/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Team Scrambler — Balanced Team Generator" />
    <meta
      name="twitter:description"
      content="Upload a CSV, configure your criteria, and instantly generate balanced teams. Free, private, runs in the browser."
    />
    <meta name="twitter:image" content="https://team-scrambler-v2.paularoid.deno.net/og-image.jpg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Team Scrambler",
        "url": "https://team-scrambler-v2.paularoid.deno.net/",
        "description": "Team Scrambler is a free tool to distribute people into balanced teams based on configurable criteria such as gender, entity affiliation, and management tier.",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Apply stored theme before first paint to avoid flash -->
    <script>
      try {
        const t = localStorage.getItem("team-scrambler-theme");
        if (t === "egg" || t === "egg-dark") document.documentElement.setAttribute("data-theme", t);
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
